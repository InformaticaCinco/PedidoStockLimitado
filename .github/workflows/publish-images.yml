name: Publicar imágenes Docker

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pedidos-java
            context: services/pedidos-java
          - name: despachos-dotnet
            context: services/despachos-dotnet
          - name: cargas-python
            context: services/cargas-python
          - name: web-host
            context: frontend/web-host
          - name: admin-mfe
            context: frontend/admin-mfe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push linux/amd64
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: ghcr.io/informaticacinco/${{ matrix.name }}:1.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mostrar digest
        run: |
          echo "IMAGEN=ghcr.io/informaticacinco/${{ matrix.name }}:1.0.0"
          echo "DIGEST=${{ steps.build.outputs.digest }}"
