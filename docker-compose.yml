name: pedido-stock-limitado

x-mongo-env: &mongo-env
  MONGODB_URI: mongodb://mongodb:27017/pedidos_stock?replicaSet=rs0
  MONGODB_DATABASE: pedidos_stock

x-jwt-env: &jwt-env
  JWT_ISSUER: ${JWT_ISSUER:-pedidos-stock}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-pedidos-stock-api}

x-http-health: &http-health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 60s

services:
  mongodb:
    image: mongo:7.0.16
    platform: linux/amd64
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: ["mongodb_data:/data/db"]
    networks: [pedidos-network]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 20s

  mongo-init:
    image: pedido-stock/mongo-tools:1.0.0
    build: ./mongo
    platform: linux/amd64
    restart: "no"
    environment:
      <<: *mongo-env
      MONGODB_REPLICA_SET: rs0
      MONGODB_BOOTSTRAP_URI: mongodb://mongodb:27017/?directConnection=true
      MONGODB_MEMBER_HOST: mongodb:27017
      MONGODB_TIMEOUT_SECONDS: "120"
      SEED_MODE: upsert
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [pedidos-network]

  pedidos-java:
    image: pedido-stock/pedidos-java:1.0.0
    build: ./services/pedidos-java
    platform: linux/amd64
    restart: unless-stopped
    environment:
      <<: [*mongo-env, *jwt-env]
      PORT: "8090"
      JWT_ACCESS_EXP_SECONDS: "900"
      JWT_REFRESH_EXP_SECONDS: "604800"
      JWT_PRIVATE_KEY_PATH: /app/keys/reto-private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/reto-public.pem
      INTERNAL_API_KEY: ${PEDIDOS_INTERNAL_KEY:-solo-reto-clave-interna-ficticia-2026}
    ports: ["8090:8090"]
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    networks: [pedidos-network]
    healthcheck:
      <<: *http-health
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://localhost:8090/health"]

  transportista-simulator:
    image: pedido-stock/transportista-simulator:1.0.0
    build: ./services/transportista-simulator
    platform: linux/amd64
    restart: unless-stopped
    environment:
      PORT: "9090"
      FAILURE_RATE: ${FAILURE_RATE:-0}
      PARTIAL_RATE: ${PARTIAL_RATE:-0}
      LATENCY_MS: ${LATENCY_MS:-3000}
    ports: ["9090:9090"]
    networks: [pedidos-network]
    healthcheck:
      <<: *http-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9090/health', timeout=4).close()"]

  despachos-dotnet:
    image: pedido-stock/despachos-dotnet:1.0.0
    build: ./services/despachos-dotnet
    platform: linux/amd64
    restart: unless-stopped
    environment:
      <<: [*mongo-env, *jwt-env]
      ASPNETCORE_URLS: http://+:8091
      PEDIDOS_BASE_URL: http://pedidos-java:8090
      TRANSPORTISTA_BASE_URL: http://transportista-simulator:9090
      JWT_JWKS_URL: http://pedidos-java:8090/.well-known/jwks.json
      PEDIDOS_INTERNAL_KEY: ${PEDIDOS_INTERNAL_KEY:-solo-reto-clave-interna-ficticia-2026}
      WORKER_POLL_MS: "1000"
      RETRY_MAX_ATTEMPTS: "3"
      RETRY_BASE_DELAY_MS: "500"
      PROCESS_TIMEOUT_SECONDS: "120"
      HTTP_TIMEOUT_SECONDS: "5"
      WORKER_LEASE_SECONDS: "30"
    ports: ["8091:8091"]
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      pedidos-java:
        condition: service_healthy
      transportista-simulator:
        condition: service_healthy
    networks: [pedidos-network]
    healthcheck:
      <<: *http-health
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://localhost:8091/health"]

  cargas-python:
    image: pedido-stock/cargas-python:1.0.0
    build: ./services/cargas-python
    platform: linux/amd64
    restart: unless-stopped
    environment:
      <<: [*mongo-env, *jwt-env]
      PORT: "8092"
      JWT_JWKS_URL: http://pedidos-java:8090/.well-known/jwks.json
      QUEUE_POLL_MS: "500"
      QUEUE_LEASE_SECONDS: "30"
      QUEUE_MAX_ATTEMPTS: "3"
      QUEUE_RETRY_BASE_MS: "1000"
      MAX_UPLOAD_BYTES: "10485760"
    ports: ["8092:8092"]
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      pedidos-java:
        condition: service_healthy
    networks: [pedidos-network]
    healthcheck:
      <<: *http-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8092/health', timeout=4).close()"]


  admin-mfe:
    image: pedido-stock/admin-mfe:1.0.0
    build: ./frontend/admin-mfe
    platform: linux/amd64
    restart: unless-stopped
    ports: ["8081:80"]
    networks: [pedidos-network]
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]

  web-host:
    image: pedido-stock/web-host:1.0.0
    build: ./frontend/web-host
    platform: linux/amd64
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on:
      pedidos-java:
        condition: service_healthy
      despachos-dotnet:
        condition: service_healthy
      cargas-python:
        condition: service_healthy
      admin-mfe:
        condition: service_healthy
    networks: [pedidos-network]
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]

volumes:
  mongodb_data:

networks:
  pedidos-network:
    driver: bridge
